<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ResumeForge - Build Your Professional Resume</title>

    <meta
        name="description"
        content="Create a professional resume with ResumeForge. Choose a template, add your details and download your resume as PDF.">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #eef2ff;

            --text: #111827;
            --muted: #6b7280;

            --background: #f8fafc;
            --white: #ffffff;

            --border: #e5e7eb;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family: "Inter", sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #eef2ff,
                    transparent 35%
                ),
                #f8fafc;

            color: var(--text);

            overflow-x: hidden;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {

            height: 72px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            background: rgba(
                255,
                255,
                255,
                .85
            );

            backdrop-filter: blur(12px);

            border-bottom:
                1px solid rgba(
                    229,
                    231,
                    235,
                    .8
                );

            position: sticky;

            top: 0;

            z-index: 1000;
        }


        .logo {

            font-size: 23px;

            font-weight: 800;

            text-decoration: none;

            color: var(--text);
        }


        .logo span {
            color: var(--primary);
        }


        .nav-links {

            display: flex;

            align-items: center;

            gap: 28px;
        }


        .nav-links a {

            text-decoration: none;

            color: #4b5563;

            font-size: 14px;

            font-weight: 600;
        }


        .nav-links a:hover {
            color: var(--primary);
        }


        .nav-btn {

            text-decoration: none;

            background: var(--primary);

            color: white;

            padding: 10px 17px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: 700;
        }


        .nav-btn:hover {
            background: var(--primary-dark);
        }


        /* =========================
           HERO
        ========================= */

        .hero {

            max-width: 1200px;

            margin: auto;

            min-height: 680px;

            padding:
                90px 25px
                70px;

            display: grid;

            grid-template-columns:
                1.05fr
                .95fr;

            align-items: center;

            gap: 60px;
        }


        .badge {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            background:
                var(--primary-light);

            color:
                var(--primary);

            padding:
                7px 11px;

            border-radius: 50px;

            font-size: 11px;

            font-weight: 700;

            margin-bottom: 20px;
        }


        .hero h1 {

            font-size:
                clamp(
                    42px,
                    5vw,
                    67px
                );

            line-height: 1.04;

            letter-spacing: -2.5px;

            margin-bottom: 22px;
        }


        .hero h1 span {
            color: var(--primary);
        }


        .hero-text {

            color: var(--muted);

            font-size: 17px;

            line-height: 1.7;

            max-width: 560px;

            margin-bottom: 30px;
        }


        .hero-buttons {

            display: flex;

            gap: 12px;

            flex-wrap: wrap;
        }


        .primary-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            background:
                var(--primary);

            color: white;

            text-decoration: none;

            padding:
                14px 20px;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 700;

            box-shadow:
                0 10px 25px
                rgba(
                    79,
                    70,
                    229,
                    .20
                );
        }


        .primary-btn:hover {
            background:
                var(--primary-dark);

            transform:
                translateY(-2px);
        }


        .secondary-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            background: white;

            color: var(--text);

            text-decoration: none;

            padding:
                14px 20px;

            border-radius: 9px;

            border:
                1px solid var(--border);

            font-size: 14px;

            font-weight: 700;
        }


        .secondary-btn:hover {
            border-color:
                var(--primary);

            color:
                var(--primary);
        }


        /* =========================
           HERO RESUME MOCKUP
        ========================= */

        .hero-preview {

            position: relative;

            display: flex;

            justify-content: center;
        }


        .resume-paper {

            width: 390px;

            min-height: 500px;

            background: white;

            border-radius: 5px;

            padding: 32px;

            box-shadow:
                0 30px 80px
                rgba(
                    15,
                    23,
                    42,
                    .18
                );

            transform:
                rotate(2deg);

            position: relative;

            overflow: hidden;
        }


        .paper-top {

            border-bottom:
                2px solid
                var(--primary);

            padding-bottom: 14px;

            margin-bottom: 18px;
        }


        .paper-name {

            font-size: 23px;

            font-weight: 800;
        }


        .paper-title {

            color:
                var(--primary);

            font-size: 10px;

            font-weight: 700;

            margin-top: 4px;
        }


        .paper-lines {

            margin-top: 10px;
        }


        .line {

            height: 6px;

            background: #e5e7eb;

            border-radius: 10px;

            margin-bottom: 7px;
        }


        .line.short {
            width: 60%;
        }


        .line.medium {
            width: 78%;
        }


        .line.small {
            width: 42%;
        }


        .paper-section {
            margin-top: 22px;
        }


        .paper-heading {

            font-size: 9px;

            font-weight: 800;

            color:
                var(--primary);

            letter-spacing:
                1px;

            margin-bottom: 9px;
        }


        .floating-card {

            position: absolute;

            background: white;

            border:
                1px solid
                var(--border);

            box-shadow:
                0 15px 40px
                rgba(
                    15,
                    23,
                    42,
                    .12
                );

            border-radius: 12px;

            padding: 14px;

            font-size: 11px;

            font-weight: 700;
        }


        .floating-card i {
            color:
                var(--primary);

            margin-right: 6px;
        }


        .card-one {

            left: 5px;

            top: 80px;
        }


        .card-two {

            right: -15px;

            bottom: 100px;
        }


        /* =========================
           TRUST
        ========================= */

        .trust {

            text-align: center;

            padding:
                15px 20px
                55px;
        }


        .trust p {

            color:
                var(--muted);

            font-size: 12px;

            font-weight: 600;
        }


        /* =========================
           FEATURES
        ========================= */

        .section {

            max-width: 1200px;

            margin: auto;

            padding:
                80px 25px;
        }


        .section-header {

            text-align: center;

            max-width: 650px;

            margin:
                0 auto 45px;
        }


        .section-header span {

            color:
                var(--primary);

            font-size: 12px;

            font-weight: 800;

            text-transform:
                uppercase;

            letter-spacing:
                1px;
        }


        .section-header h2 {

            font-size:
                clamp(
                    30px,
                    4vw,
                    43px
                );

            margin:
                10px 0 12px;

            letter-spacing:
                -1px;
        }


        .section-header p {

            color:
                var(--muted);

            font-size: 14px;

            line-height: 1.7;
        }


        .features {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }


        .feature {

            background:
                white;

            border:
                1px solid
                var(--border);

            border-radius: 14px;

            padding: 28px;

            transition:
                .25s;
        }


        .feature:hover {

            transform:
                translateY(-5px);

            box-shadow:
                0 20px 50px
                rgba(
                    15,
                    23,
                    42,
                    .08
                );
        }


        .feature-icon {

            width: 46px;

            height: 46px;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                var(--primary-light);

            color:
                var(--primary);

            margin-bottom: 18px;
        }


        .feature h3 {

            font-size: 17px;

            margin-bottom: 8px;
        }


        .feature p {

            color:
                var(--muted);

            font-size: 13px;

            line-height: 1.6;
        }


        /* =========================
           TEMPLATES
        ========================= */

        .templates {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 25px;
        }


        .template {

            background:
                white;

            border:
                1px solid
                var(--border);

            border-radius: 14px;

            padding: 14px;

            transition: .25s;
        }


        .template:hover {

            transform:
                translateY(-6px);

            box-shadow:
                0 20px 50px
                rgba(
                    15,
                    23,
                    42,
                    .10
                );
        }


        .template-paper {

            height: 390px;

            border:
                1px solid
                var(--border);

            padding: 28px;

            background:
                white;
        }


        .template-paper.classic {

            font-family:
                Georgia, serif;

            text-align:
                center;
        }


        .template-paper.minimal {

            font-family:
                "Inter", sans-serif;
        }


        .template-paper h3 {

            font-size: 20px;

            margin-bottom: 5px;
        }


        .template-paper .role {

            color:
                var(--primary);

            font-size: 9px;

            font-weight: 700;

            margin-bottom: 12px;
        }


        .template-paper.classic .role {

            color:
                #111827;

            font-weight: 400;
        }


        .template-info {

            padding: 17px 3px 3px;
        }


        .template-info h3 {

            font-size: 16px;

            margin-bottom: 5px;
        }


        .template-info p {

            color:
                var(--muted);

            font-size: 12px;

            line-height: 1.5;
        }


        /* =========================
           HOW IT WORKS
        ========================= */

        .steps {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 25px;
        }


        .step {

            text-align: center;

            padding: 25px;
        }


        .step-number {

            width: 48px;

            height: 48px;

            border-radius: 50%;

            background:
                var(--primary);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            margin:
                0 auto 18px;

            font-weight: 800;
        }


        .step h3 {

            font-size: 17px;

            margin-bottom: 8px;
        }


        .step p {

            color:
                var(--muted);

            font-size: 13px;

            line-height: 1.6;
        }


        /* =========================
           CTA
        ========================= */

        .cta {

            max-width: 1100px;

            margin:
                50px auto 90px;

            padding:
                65px 30px;

            text-align: center;

            border-radius: 20px;

            background:
                var(--primary);

            color: white;
        }


        .cta h2 {

            font-size:
                clamp(
                    30px,
                    4vw,
                    45px
                );

            margin-bottom: 12px;
        }


        .cta p {

            opacity: .85;

            font-size: 14px;

            margin-bottom: 25px;
        }


        .cta-btn {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            background: white;

            color:
                var(--primary);

            padding:
                13px 20px;

            border-radius: 9px;

            text-decoration: none;

            font-weight: 800;

            font-size: 13px;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            border-top:
                1px solid
                var(--border);

            background: white;

            padding:
                30px 7%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        footer p {

            color:
                var(--muted);

            font-size: 12px;
        }


        .footer-links {

            display: flex;

            gap: 20px;
        }


        .footer-links a {

            text-decoration: none;

            color:
                var(--muted);

            font-size: 12px;

            font-weight: 600;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width: 900px) {

            .hero {

                grid-template-columns:
                    1fr;

                text-align:
                    center;

                padding-top:
                    70px;
            }


            .hero-text {

                margin-left:
                    auto;

                margin-right:
                    auto;
            }


            .hero-buttons {

                justify-content:
                    center;
            }


            .features,
            .templates,
            .steps {

                grid-template-columns:
                    1fr 1fr;
            }


            .hero-preview {

                margin-top:
                    25px;
            }

        }


        @media(max-width: 650px) {

            nav {

                padding:
                    0 15px;
            }


            .nav-links a:not(.nav-btn) {

                display:
                    none;
            }


            .hero {

                padding:
                    60px 18px;
            }


            .hero h1 {

                letter-spacing:
                    -1.5px;
            }


            .resume-paper {

                width:
                    320px;

                min-height:
                    440px;
            }


            .features,
            .templates,
            .steps {

                grid-template-columns:
                    1fr;
            }


            .section {

                padding:
                    60px 18px;
            }


            .floating-card {

                display:
                    none;
            }


            footer {

                flex-direction:
                    column;

                text-align:
                    center;
            }

        }

    </style>

</head>


<body>

====================================== -->

<nav>

    <a

    </a>


    <div class="nav-links">

        <a href="#features">

        </a>

        <a href="#templates">
            Templates
        </a>

        <a href="#how">

        </a>

        <a
            href="builder.html"
            class="nav-btn">

        </a>

    </div>

</nav>
